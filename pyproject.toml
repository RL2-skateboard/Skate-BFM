[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skate-sim"
version = "0.1.0"
description = "Interactive MuJoCo and mjlab skateboard simulation workbench"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
validation = ["scipy==1.15.3", "osqp==0.6.7.post3", "clarabel==0.11.1"]
contact = ["numpy>=1.26,<2.0", "torch>=2.7,<2.8", "matplotlib>=3.8,<4"]
mujoco = ["mujoco==3.11.0", "numpy>=1.26,<2.0"]
mjlab = ["mjlab==1.6.0", "mujoco-warp==3.11.0", "warp-lang==1.17.0", "onnxruntime>=1.18,<2", "joblib>=1.3,<2"]

[project.scripts]
skate-sim = "skate_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skate_sim.validation" = ["reference05/*.yaml", "reference05/*.json", "reference05/*.md", "reference05/LICENSE*"]
