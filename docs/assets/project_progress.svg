  <title id="title">Skate-BFM overall research program as of 2026-08-11</title>
  <desc id="desc">The frozen BFM0 and HUSKY baseline, expert motion integration, F/B-only adaptation boundary, target-conditioned preflight, cleanup, full-training dependency audit, Skate auxiliary reward contract, native termination contract, and 1, 10, and 100-update native full-update smokes are verified. M2.5 is the original BFM-Zero Skate baseline; downstream planning follows later.</desc>

