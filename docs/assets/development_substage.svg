    <rect x="948" y="432" width="500" height="155" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="974" y="471" fill="#64748b" font-size="14" font-weight="700">M2.3b  NEXT</text>
    <text x="974" y="505" fill="#17212b" font-size="20" font-weight="700">Execute target latent</text>
    <text x="974" y="532" fill="#475569" font-size="14">Run frozen Actor with command evidence</text>
    <text x="974" y="555" fill="#475569" font-size="14">Then address retention, Qaux, termination</text>
    <circle cx="1402" cy="505" r="19" fill="#94a3b8"/>
    <path d="M1394 505 L1410 505" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

