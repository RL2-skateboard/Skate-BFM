    <circle cx="78" cy="668" r="10" fill="#1f7a4d"/>
    <text x="98" y="674" fill="#17212b" font-size="14" font-weight="700">COMPLETE</text>
    <circle cx="245" cy="668" r="10" fill="#d97706"/>
    <text x="265" y="674" fill="#17212b" font-size="14" font-weight="700">ACTIVE</text>
    <circle cx="385" cy="668" r="10" fill="#94a3b8"/>
    <text x="405" y="674" fill="#17212b" font-size="14" font-weight="700">NEXT / LATER</text>
