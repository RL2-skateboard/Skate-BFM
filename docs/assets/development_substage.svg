  <text x="1032" y="86" fill="#17212b" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">M2.3a-0 Target bank audit</text>
  <text x="1032" y="105" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">One forward-push target; command evidence recorded</text>

