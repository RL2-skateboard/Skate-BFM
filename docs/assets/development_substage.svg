<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Skate-BFM development substage pipeline as of 2026-08-11</title>
  <desc id="desc">M0 baseline, M1 expert motion, M2.1 formal HUSKY online replay, M2.2a pretrained expert/replay merge, M2.2b-1 F/B-only adaptation, M2.2b-2 evaluator audit, M2.2b-3 expert mixture, and M2.3a-0 target-bank command audit are complete. Full FB-CPR-Aux training follows.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1500" height="760" fill="#f8fafc"/>
  <rect width="1500" height="12" fill="#d97706"/>

